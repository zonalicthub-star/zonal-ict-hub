<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>අන්තර්ජාල බිල්පත් පියවීම 2026 - වැල්ලවාය අධ්‍යාපන කලාපය</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #0d9488;
            --primary-dark: #0f766e;
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background-color: var(--primary-dark);
            color: white;
            text-align: center;
            padding: 20px 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .header h2 {
            margin: 5px 0 0 0;
            font-size: 16px;
            font-weight: 400;
            color: #ccfbf1;
        }
        .main-wrapper {
            flex: 1;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .tabs {
            display: flex;
            background-color: #f1f5f9;
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border: none;
            background: none;
            color: #64748b;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background-color: white;
            color: var(--primary-dark);
            border-bottom: 3px solid var(--primary-color);
        }
        .tab-btn:hover:not(.active) {
            background-color: #e2e8f0;
        }
        .tab-content {
            display: none;
            padding: 30px;
        }
        .tab-content.active {
            display: block;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            position: relative;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
        }
        .btn {
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: var(--primary-dark);
        }
        .notice-msg {
            padding: 10px;
            border-radius: 5px;
            display: none;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .msg-info { color: #0284c7; background: #e0f2fe; }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .readonly-field {
            background-color: #f1f5f9;
            color: #64748b;
        }
        .btn-submit {
            width: 100%;
            background-color: #059669;
            margin-top: 20px;
        }
        .btn-submit:hover {
            background-color: #047857;
        }
        .btn-backup {
            background-color: #0284c7;
        }
        .btn-backup:hover {
            background-color: #0369a1;
        }
        #schoolNameDisplay {
            text-align: center;
            color: var(--primary-dark);
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }
        .zone-login {
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }
        .zone-login input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
        }
        .zone-dashboard {
            display: none;
            text-align: center;
        }
        .stat-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .stat-card h3 { margin: 0; color: #64748b; }
        .stat-card p { font-size: 32px; font-weight: bold; color: var(--primary-dark); margin: 10px 0 0 0; }

        /* Custom Popup Modal Styles */
        .custom-popup {
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); 
            align-items: center; justify-content: center; 
            z-index: 1000;
        }
        .popup-content {
            background: white; padding: 30px 20px; border-radius: 12px; 
            max-width: 400px; width: 85%;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .popup-icon { font-size: 50px; margin-bottom: 15px; }
        .popup-success { color: #059669; }
        .popup-error { color: #dc2626; }
        .popup-btn {
            margin-top: 25px; padding: 12px 30px; background: var(--primary-color);
            color: white; border: none; border-radius: 6px; cursor: pointer; 
            font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s;
        }
        .popup-btn:hover { background: var(--primary-dark); }
        
        /* Footer Styles */
        .site-footer {
            text-align: center;
            padding: 20px 10px;
            background-color: white;
            color: #64748b;
            font-size: 14px;
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
        }

        @media screen and (max-width: 768px) {
            .tabs { flex-direction: column; }
            .tab-btn { border-bottom: 1px solid var(--border-color); }

            .search-box { flex-direction: column; }
            .btn { width: 100%; }
            .container { margin: 10px; border-radius: 5px; }
            .tab-content { padding: 15px; }
            .header h1 { font-size: 20px; }
            .header h2 { font-size: 14px; }
        }
    </style>
</head>

</div>

<div class="main-wrapper">
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('schoolView', this)">පාසල් සඳහා (School Update)</button>
            <button class="tab-btn" onclick="switchTab('zoneView', this)">කලාප කාර්යාලය සඳහා (Zone Download)</button>
        </div>

        <div id="schoolView" class="tab-content active">
            <div class="search-box">

            </div>
            
            <div id="newSchoolMsg" class="notice-msg msg-info">මෙම අංකයෙන් නව පාසලක් පද්ධතියට එක් කළ හැක.</div>

            <div id="formSection" style="display:none;">
                <h3 id="schoolNameDisplay"></h3>
                <form id="dataForm" class="form-grid"></form>
                <!-- Update Button -->
                <button id="updateBtn" class="btn btn-submit" type="button" onclick="updateData()">තොරතුරු යාවත්කාලීන (Update) කරන්න</button>
            </div>
        </div>

        <div id="zoneView" class="tab-content">
            <div id="loginSection" class="zone-login">
                <h3>කලාප කාර්යාලයේ දත්ත පද්ධතිය</h3>
                <p>දත්ත ලබා ගැනීම සඳහා මුරපදය ඇතුළත් කරන්න</p>
                <input type="password" id="zonePassword" placeholder="මුරපදය (Password)...">
                <button class="btn" onclick="loginZone()">ඇතුල් වන්න</button>
                <p id="loginError" style="color:red; display:none; margin-top:10px;">මුරපදය වැරදියි!</p>
            </div>

            <div id="dashboardSection" class="zone-dashboard">
                <div class="stat-card">
                    <h3>මුළු පාසල් ගණන (පද්ධතියේ ඇති)</h3>
                    <p id="totalSchoolsDisplay">0</p>
                </div>
                <!-- Backup All Data Button -->
                <button id="backupBtn" class="btn btn-submit btn-backup" onclick="backupAllData()" style="width:100%; padding:15px; margin-bottom: 10px;">

                </button>
                
                <button class="btn btn-submit" onclick="downloadMasterExcel()" style="width:100%; padding:15px;">
                    Download Master Excel Sheet
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Footer Section -->
<footer class="site-footer">
    &copy; 2026 Wellawaya Zonal Education Office - ICT Division

<div id="customPopup" class="custom-popup">

    </div>
</div>

    window.onload = function() { 
        populateDatalist();
    };

    function populateDatalist() {
        var datalist = document.getElementById('schoolsList');
        datalist.innerHTML = '';
        rawData.forEach(function(row) {
            var option = document.createElement('option');
            option.value = String(row['School Census No']).replace('.0', '').trim();
            option.text = row['Name of the School'];
            datalist.appendChild(option);
        });
        document.getElementById('totalSchoolsDisplay').innerText = rawData.length;
    }

    function showPopup(title, msg, isSuccess) {
        document.getElementById('popupTitle').innerText = title;
        document.getElementById('popupMessage').innerText = msg;
        var icon = document.getElementById('popupIcon');
        if(isSuccess) {
            icon.innerHTML = "✅";
            icon.className = "popup-icon popup-success";
        } else {
            icon.innerHTML = "⚠️";
            icon.className = "popup-icon popup-error";
        }
        document.getElementById('customPopup').style.display = 'flex';
    }

    function closePopup() {
        document.getElementById('customPopup').style.display = 'none';
    }

    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
    }

    function searchSchool() {
        var censusInput = document.getElementById('censusNo').value.trim();
        if (!censusInput) return;

        var foundRecord = null;
        currentIndex = -1;

        for (var i = 0; i < rawData.length; i++) {
            var currentCensus = String(rawData[i]['School Census No']).replace('.0', '').trim();
            if (currentCensus === censusInput) {
                currentIndex = i;
                foundRecord = rawData[i];
                break;
            }
        }
        
        if (foundRecord) {
            document.getElementById('newSchoolMsg').style.display = 'none';
            document.getElementById('updateBtn').innerText = "තොරතුරු යාවත්කාලීන (Update) කරන්න";
            populateForm(foundRecord, false);
        } else {
            document.getElementById('newSchoolMsg').style.display = 'block';
            document.getElementById('updateBtn').innerText = "නව පාසල පද්ධතියට එක් කරන්න (Save New)";
            
            var emptyRecord = {};
            columns.forEach(col => emptyRecord[col] = "");
            emptyRecord['School Census No'] = censusInput;
            populateForm(emptyRecord, true);
        }
        document.getElementById('formSection').style.display = 'block';
    }

            var input = document.createElement('input');
            input.type = 'text';
            input.id = 'field_' + i;
            input.value = record[col];
            
            if (col === 'School Census No') {
                input.readOnly = true;
                input.className = 'readonly-field';
            } else if (!isNew && (col === 'Name of the School' || col === 'Province' || col.indexOf('Education Zone') !== -1)) {
                input.readOnly = true;
                input.className = 'readonly-field';
            }

            div.appendChild(label);
            div.appendChild(input);
            form.appendChild(div);
        }
    }

    async function updateData() {
        var rowValues = [];
        var newRecordObj = {};
        
        for (var i = 0; i < columns.length; i++) {
            var val = document.getElementById('field_' + i).value;
            rowValues.push(val);
            newRecordObj[columns[i]] = val;
        }
        
        var payload = {
            action: "update",
            data: rowValues
        };
        
        var updateBtn = document.getElementById('updateBtn');
        var oldBtnText = updateBtn.innerText;
        updateBtn.innerText = "දත්ත යාවත්කාලීන වෙමින් පවතී...";
        updateBtn.disabled = true;
        updateBtn.style.backgroundColor = "#94a3b8";
        
        try {
            // CORS ගැටලුව මඟහැරීමට text/plain ලෙස යැවීම
            await fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            
            // HTML පිටුවේ දත්ත යාවත්කාලීන කිරීම (ලැයිස්තුව සඳහා)
            if (currentIndex === -1) {
                rawData.push(newRecordObj);
            } else {
                rawData[currentIndex] = newRecordObj;
            }
            populateDatalist();

            showPopup("සාර්ථකයි!", "දත්ත සාර්ථකව Google Sheet වෙත Submit කරන ලදී!", true);
            
            document.getElementById('censusNo').value = '';
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('newSchoolMsg').style.display = 'none';
            currentIndex = -1;
        } catch (error) {
            console.error(error);
            showPopup("දෝෂයක්!", "අන්තර්ජාල සබඳතාවයේ හෝ Google Sheet සම්බන්ධයේ දෝෂයක් මතු විය.", false);
        } finally {
            updateBtn.innerText = oldBtnText;
            updateBtn.disabled = false;
            updateBtn.style.backgroundColor = "#059669";
        }
    }

    async function backupAllData() {
        var btn = document.getElementById('backupBtn');
        btn.innerText = "Backup වෙමින් පවතී... කරුණාකර රැඳී සිටින්න";
        btn.disabled = true;
        btn.style.backgroundColor = "#94a3b8";

        var rowsToBackup = rawData.map(record => columns.map(col => record[col]));
        
        var payload = {
            action: "backup",
            data: rowsToBackup
        };

        try {
            // CORS ගැටලුව මඟහැරීමට text/plain ලෙස යැවීම
            await fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            showPopup("Backup සාර්ථකයි!", "සියලුම පාසල්වල දත්ත සාර්ථකව Google Sheet වෙත Backup කරන ලදී!", true);
        } catch (error) {
            console.error(error);
            showPopup("දෝෂයක්!", "අන්තර්ජාල සබඳතාවයේ හෝ Google Sheet සම්බන්ධයේ දෝෂයක් මතු විය.", false);
        } finally {
            btn.innerText = "දැනට ඇති සියලුම දත්ත Google Sheet එකට Backup කරන්න";
            btn.disabled = false;
            btn.style.backgroundColor = "#0284c7";
        }
    }

    function loginZone() {
        var pw = document.getElementById('zonePassword').value;
        if (pw === "zone123") {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('totalSchoolsDisplay').innerText = rawData.length;
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function downloadMasterExcel() {
        try {
            var ws = XLSX.utils.json_to_sheet(rawData);
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Master Data 2026");
            XLSX.writeFile(wb, "Wellawaya_Internet_Bills_Master.xlsx");
        } catch (error) {
            showPopup("දෝෂයක්!", "Excel ගොනුව සැකසීමේදී දෝෂයක් මතු විය.", false);
        }
    }
</script>
